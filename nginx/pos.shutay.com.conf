# pos.shutay.com リバースプロキシ設定（Ubuntu ホストの Nginx 用）
# 配置例: /etc/nginx/sites-available/pos.shutay.com → sites-enabled にシンボリックリンク
#
# 前提: docker compose -f compose.prod.yml up -d で
#   frontend=127.0.0.1:3001 / backend=127.0.0.1:8001 / reverb(WS)=127.0.0.1:8080
# が起動していること。
#
# TLS は `sudo certbot --nginx -d pos.shutay.com` で自動付与される（DEPLOY.md 参照）。
# certbot がこの server ブロックに listen 443 ssl と証明書行を追記し、80→443 リダイレクトも作成する。

# WebSocket アップグレード判定（アップグレード時のみ Connection: upgrade）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name pos.shutay.com;

    # 大きめの注文でも通るように
    client_max_body_size 10m;

    # API（Laravel）— /api/ のパスを保持して転送
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket（Laravel Reverb, Pusherプロトコルの /app/{key}）
    location /app/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # フロントエンド（Next.js standalone）
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
