# pos.shutay.com リバースプロキシ設定（Ubuntu ホストの Nginx 用）
# 配置例: /etc/nginx/sites-available/pos.shutay.com → sites-enabled にシンボリックリンク
#
# 前提: docker compose -f compose.prod.yml up -d で
#   frontend=127.0.0.1:3001 / backend=127.0.0.1:8001 / reverb(WS)=127.0.0.1:8080
# が起動していること。TLS証明書は Let's Encrypt（DEPLOY.md 参照）。

# HTTP: Let's Encrypt の更新用と HTTPS へのリダイレクト
server {
    listen 80;
    listen [::]:80;
    server_name pos.shutay.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 本体
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pos.shutay.com;

    ssl_certificate     /etc/letsencrypt/live/pos.shutay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.shutay.com/privkey.pem;

    # 大きめの注文でも通るように
    client_max_body_size 10m;

    # API（Laravel）
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket（Laravel Reverb, Pusherプロトコルの /app/{key}）
    location /app {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # フロントエンド（Next.js）
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
